<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ダーツ命中分析 | Impact Heatmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand">
        <div class="brand-title">IMPACT HEATMAP</div>
      </div>
    </header>

    <main class="layout">
      <section class="card board" data-reveal>
        <div class="card-header">
          <h2>HEATMAP</h2>
        </div>
        <div class="board-wrap">
          <div class="svg-wrap">
            <svg
              id="boardSvg"
              viewBox="0 0 400 400"
              role="img"
              aria-label="ダーツボードのヒートマップ"
            ></svg>
          </div>
          <div class="hover-info" id="hoverInfo">
            <div class="hover-title">セグメントを選択</div>
            <div class="hover-body">
              ホバーするとリング別の命中数が表示されます。
            </div>
          </div>
        </div>
        <div class="legend" id="legend"></div>
      </section>

      <section class="card data" data-reveal>
        <div class="card-header">
          <h2>DATA</h2>
          <p>表に直接入力できます。CSVインポートで表に反映されます。</p>
        </div>
        <div class="data-actions">
          <label class="file">
            <span>CSVインポート</span>
            <input id="fileInput" type="file" accept=".csv" />
          </label>
          <button id="useSample" type="button">サンプルを読み込む</button>
          <div id="status" class="status" role="status"></div>
        </div>
        <div class="table-wrap">
          <table class="number-table editable">
            <thead>
              <tr>
                <th>No.</th>
                <th>内</th>
                <th>外</th>
                <th>D</th>
                <th>T</th>
                <th>合計</th>
              </tr>
            </thead>
            <tbody id="numberTableBody"></tbody>
          </table>
        </div>
        <div class="bull-inputs">
          <div class="bull-field">
            <label for="bullSingle">S-BULL</label>
            <input id="bullSingle" type="number" min="0" />
          </div>
          <div class="bull-field">
            <label for="bullDouble">D-BULL</label>
            <input id="bullDouble" type="number" min="0" />
          </div>
          <div class="bull-field">
            <label for="outCount">OUT</label>
            <input id="outCount" type="number" min="0" />
          </div>
        </div>
      </section>

      <section class="card stats" data-reveal>
        <div class="card-header">
          <h2>STATS</h2>
          <p>全体の分布と合計を集計しています。</p>
        </div>
        <div class="totals" id="totals"></div>
        <div class="bars" id="ringBars"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
